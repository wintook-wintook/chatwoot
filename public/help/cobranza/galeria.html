<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Galería de capturas · Cobranza / ERP</title>
    <style>
      :root { color-scheme: light dark; --bg:#f8fafc; --card:#fff; --fg:#1e293b; --muted:#64748b; --border:#e2e8f0; --accent:#4f46e5; }
      @media (prefers-color-scheme: dark){ :root{ --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --border:#334155; --accent:#818cf8; } }
      *{box-sizing:border-box}
      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);padding:2rem 1rem 4rem}
      header{max-width:1100px;margin:0 auto 1.5rem}
      header h1{margin:0 0 .25rem;font-size:1.6rem}
      header p{margin:0;color:var(--muted)}
      header a{color:var(--accent)}
      .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
      figure{margin:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
      figure img{display:block;width:100%;height:auto;cursor:zoom-in;background:#fff}
      figcaption{padding:.6rem .85rem;font-size:.85rem;color:var(--muted);border-top:1px solid var(--border)}
      figcaption b{color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
      .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:2rem;z-index:1000;cursor:zoom-out}
      .lightbox img{max-width:96%;max-height:96%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
    </style>
  </head>
  <body>
    <header>
      <h1>Galería de capturas · Cobranza / ERP</h1>
      <p>Las 10 capturas del <a href="/help/cobranza/">manual</a>, todas en una vista. Clic para ampliar.</p>
    </header>
    <div class="grid" id="grid"></div>
    <script>
      var shots = [
        ['acceso', 'Cómo acceder — menú del módulo'],
        ['conexiones', 'Conexiones a ERP (listado)'],
        ['conexion-form', 'Formulario de nueva conexión'],
        ['consultas', 'Consultas predefinidas de una conexión'],
        ['consola', 'Consola ERP — consulta + parámetros'],
        ['consola-resultado', 'Consola — resultado en tabla (Microsip)'],
        ['consola-ia', 'Modo B / IA — respuesta en lenguaje natural'],
        ['bots', 'Bots cobradores (listado)'],
        ['bot-form', 'Formulario de bot cobrador'],
        ['bot-preview', 'Vista previa (dry-run) de los mensajes']
      ];
      var g = document.getElementById('grid');
      shots.forEach(function (s) {
        var fig = document.createElement('figure');
        var img = document.createElement('img');
        img.src = 'img/' + s[0] + '.png'; img.alt = s[1]; img.loading = 'lazy';
        img.addEventListener('click', function () {
          var box = document.createElement('div'); box.className = 'lightbox';
          var full = document.createElement('img'); full.src = img.src; box.appendChild(full);
          box.addEventListener('click', function () { box.remove(); });
          document.body.appendChild(box);
        });
        var cap = document.createElement('figcaption');
        cap.innerHTML = '<b>' + s[0] + '.png</b> · ' + s[1];
        fig.appendChild(img); fig.appendChild(cap); g.appendChild(fig);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { var lb = document.querySelector('.lightbox'); if (lb) lb.remove(); }
      });
    </script>
  </body>
</html>
