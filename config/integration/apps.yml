crmzeus:
  id: crmzeus
  logo: crmzeus.png
  i18n_key: crmzeus
  action: /crmzeus
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema: {
    "type": "object",
    "properties": {
      "api_url_base": { "type": "string" },
      "api_access_token": { "type": "string" },
      "webhook": { 
        "type": "string",
        "default": "https://api.wintook.com/api/v1/${access_token}/webhook"
      },
      "webhook_id": { 
        "type": "number",
        "default": 0
      }
    },
    "required": ["api_url_base", "api_access_token", "webhook", "webhook_id"],
    "additionalProperties": false,
  }
  settings_form_schema: [
    {
      "label": "Direccion Url Kontrolya",
      "type": "url",
      "name": "api_url_base",
      "validation": "required",
      "validationName": "API Url Kontrolya",
    },
    {
      "label": "Access Token Kontrolya",
      "type": "text",
      "name": "api_access_token",
      "validation": "required",
      "validationName": "Access Token Kontrolya",
    },
    {
      "label": "Webhook URL",
      "type": "text",
      "name": "webhook",
      "validation": "required|url",
      "validationName": "Webhook URL",
      "value": "https://api.wintook.com/api/v1/${access_token}/webhook",
      "help": "URL donde Kontrolya enviará las notificaciones"
    },
    {
      "label": "Webhook ID",
      "type": "number",
      "name": "webhook_id",
      "validation": "required",
      "validationName": "Webhook ID",
      "value": 0,
      "hidden": true,
      "disabled": true,
      "help": "Identificador numérico único para el webhook (generado automáticamente)"
    }
  ]
  visible_properties: ['api_url_base', 'api_access_token', 'webhook']
  # DEV0002

