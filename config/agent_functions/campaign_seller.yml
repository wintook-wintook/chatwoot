title: Vendedor de campaña
summary: 'Toca la puerta en tus campañas: invita, ofrece, reactiva o encuesta; resuelve las primeras dudas y pasa al interesado a tu agente de prospectos, al de clientes o a tu equipo.'
objective: Despertar el interés con la oferta de la campaña y pasar al interesado a quien sigue.
