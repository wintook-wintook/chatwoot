# Función «Vendedor de campaña» (Plan-Motor-Agentes.md §11.16). Toca la puerta: la campaña manda el
# primer mensaje (plantilla) y, cuando contesta, despierta el interés, resuelve 2–3 dudas y pasa el
# relevo (Motor2::Relay). El puesto va en campaign_seller.md; la oferta y los usos (invitar, ofrecer,
# reactivar, renovar, encuesta), en Motor2::Functions::CampaignSeller.
key: campaign_seller
