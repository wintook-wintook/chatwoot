# proyecto@asistente_agentes_ia — mensajes del comprobador
#
# ⚠ ESTOS TEXTOS NO SON COSMÉTICA.
#   Van a dos lectores: la persona que corrige el Entrenamiento en el panel, y el
#   MODELO, que los recibe textuales en el bucle de corrección
#   (InterviewService#repair_prompt). Medido el 08/09/2026 con el mismo texto roto:
#   con un veredicto pelado ("no hay ninguna línea @ruta") se reparaba 1 de 3 veces;
#   nombrando el carácter que falta y su línea, 3 de 3.
#
#   Cada mensaje tiene que decir CUÁL ES LA CONSECUENCIA, no solo que algo está mal.
#   Acortarlos "para que se vean más limpios" es lo que los vuelve inútiles.
#
# ⚠ Lo que va entre @ y paréntesis NO se traduce: @ruta, @crear_ticket,
#   @buscar_predefinidas son literales que el parser busca con regex fijas.
es:
  tracking_assistant:
    unparsed:
      no_closing_paren: 'falta el paréntesis de cierre del @ruta('
      no_colon: 'falta el ":" inmediatamente después del paréntesis de cierre'
      bad_name: 'el nombre de la ruta solo admite letras, números, guion y guion bajo, sin espacios ni acentos'
      no_source: 'después del paréntesis de cierre falta «: fuente»; si esta ruta no consulta nada, termínala con «): -»'
      generic: 'no respeta la forma @ruta(nombre #etiqueta: descripción): fuente'
    repair:
      header: 'El comprobador del motor rechazó ese Entrenamiento:'
      footer: Corrige exactamente eso y devuelve el Entrenamiento completo de nuevo.
      wrote: 'Escribiste:'
      route_header: >-
        Probé tu Entrenamiento: tomé la descripción de cada ruta y le pregunté al clasificador real
        a qué ruta la manda. Estas no se eligen a sí mismas:
      route_mismatch_line: '- la ruta "%{route}", probada con "%{probe}", cayó en "%{chosen}"'
      route_none: (ninguna ruta)
      route_footer: >-
        Eso significa que esas descripciones se confunden entre sí. Reescribilas para que no se
        pisen —situaciones distintas, en las palabras del cliente— y devolvé el Entrenamiento
        completo de nuevo. No toques las líneas que ya estaban bien.
      edit_header: >-
        Comparé lo que devolviste con el ENTRENAMIENTO ACTUAL y cambiaste esto sin declararlo en "toca":
      edit_removed: '- quitaste %{key}'
      edit_changed: '- cambiaste %{key}'
      edit_added: '- agregaste %{key}'
      edit_footer: >-
        Si la persona no lo pidió, devolvé esas partes EXACTAMENTE como estaban en el ENTRENAMIENTO
        ACTUAL, carácter por carácter. Si sí lo pidió, dejalas y nombralas en "toca". Devolvé el
        Entrenamiento completo de nuevo.
      missing_mode: >-
        Entregaste el Entrenamiento sin preguntar si el agente CONTESTA primero y abre el caso solo
        si no pudo resolver, o si SOLO recauda datos y abre el caso siempre. Son dos agentes
        distintos y no se deduce del pedido. No entregues nada todavía: hacé esa pregunta, con las
        dos opciones, y devolvé "entrenamiento": null.
    warnings:
      calendar_not_assigned: >-
        «%{name}» quedó guardado, pero no tiene ningún calendario asignado, así que
        @agendar_calendar no va a agendar nada. Asígnale un calendario en la ficha del Agente IA:
        tener el calendario conectado en la cuenta no alcanza, el motor lo busca en el agente.
    analysis:
      header: '**Lo que marca el comprobador** (%{count}):'
      clean: '**El comprobador no marca nada:** el motor lee y ejecuta todo lo que está escrito.'
      line: 'línea %{line} %{wrote}'
      groups:
        labels: '**Etiquetas que no existen en la cuenta** (%{count}): no disparan ninguna automatización. Créalas en Etiquetas o cámbialas por una que exista.'
        loose: '**Directivas en la prosa que no se ejecutan** (%{count}): la búsqueda la hace el motor según la ruta. Nombra «la información consultada» en vez de la directiva.'
        nothing: '**Rutas que no consultan nada ni tienen «si no resuelve»** (%{count}): contestan solo con el Entrenamiento. Si es a propósito (saludo, despedida, pedir datos), déjalas así.'
        bare_tags: '**Etiquetas sueltas, sin significado** (%{count}): el agente las pega a todas sus respuestas. Escríbelas como diccionario («#x = cuándo se usa») o bórralas.'
        sources: '**Rutas que buscan en una fuente que no existe en la cuenta** (%{count}): no van a encontrar nada. Créala desde el modal de la ruta («Agregarla») o elige una que exista.'
    fix_offer:
      question: 'Se pueden corregir %{count} avisos editando el texto. ¿Los corrijo?'
      'yes': 'Sí, corrige lo que se puede en el texto'
    findings:
      route_line_unparsed: >-
        Línea %{line}: el motor NO la reconoce como ruta — %{reason}. El patrón exacto es
        @ruta(nombre #etiqueta: descripción): fuente -> escalamiento
      no_routes: >-
        El motor va a leer 0 rutas: no hay ninguna línea @ruta. Sin rutas, todos los mensajes
        caen al camino conversacional y no se consulta ninguna fuente.
      unknown_source: >-
        La ruta '%{route}' declara una fuente que el motor no reconoce. Se ignora y la ruta va a
        contestar sin consultar nada.
      source_not_found: >-
        La ruta '%{route}' apunta a la fuente "%{name}", que no existe en esta cuenta. El motor no
        va a fallar: va a buscar y no encontrar nunca. Las que sí existen: %{available}.
      source_none_loaded: (ninguna cargada)
      action_trapped_in_source: >-
        En la ruta '%{route}' la directiva %{directive} quedó del lado de la fuente, no del
        escalamiento: le falta la flecha "->" o está mal escrita. Tal como está, esa acción no se
        ejecuta nunca. La forma es: fuente -> @crear_ticket(...)
      case_type_not_found: >-
        @crear_ticket(tipo=%{type}) — ese tipo de caso no existe en la cuenta. Los que existen: %{available}.
      case_type_none_created: (ninguno creado)
      default_route_unknown: >-
        @ruta_por_defecto apunta a '%{declared}', que no es ninguna de las rutas declaradas (%{routes}).
      default_route_no_routes: no hay rutas
      route_not_self_chosen: >-
        Probé la ruta "%{route}" con su propia descripción ("%{probe}") y el motor eligió
        "%{chosen}". Esa descripción se pisa con la de otra ruta: como está, esta ruta casi
        nunca se va a elegir. Escribe situaciones que solo apliquen a ella.
      contract_label: >-
        %{count} línea(s) con un rótulo del Asistente entre ═══ (línea(s) %{lines}). Esos rótulos son de
        las instrucciones con las que se arma el Entrenamiento, no del agente: si quedan, el agente los
        lee como parte de su prompt. Borra esas líneas enteras.
      contract_wrap: >-
        %{count} línea(s) con texto entre ‹ › (línea(s) %{lines}). Los ‹ › marcan en la plantilla dónde
        va el contenido; no son parte de él. Quita solo los signos ‹ › y deja la instrucción tal cual.
      pending_marker: >-
        Faltan %{count} dato(s) por completar: %{items}. Mientras quede alguna marca así no se puede
        guardar: el agente la leería tal cual y se la diría al cliente.
      duplicate_route_description: >-
        Estas rutas tienen la MISMA descripción: %{routes}. La descripción es lo único que el
        clasificador usa para decidir, así que no las puede distinguir: una de las dos no se va a
        elegir nunca, y cuál pierde depende del orden. Dales descripciones que no se confundan —
        situaciones distintas, en las palabras del cliente.
      unclosed_ticket: >-
        La ruta '%{route}' tiene «%{wrote}» sin el «%{closer}» de cierre. El motor abre el caso igual,
        pero IGNORA lo que va entre paréntesis (tipo y prioridad): sale con los de por defecto. Agrega
        el «%{closer}» al final.
      unclosed_directive: >-
        La ruta '%{route}' tiene «%{wrote}» sin el «%{closer}» de cierre: el motor no lee lo que va
        adentro. Agrega el «%{closer}».
      section_header_broken: >-
        Línea %{line}: el rótulo «%{wrote}» está mal escrito — %{problem}. Va así: [%{title}]. Como
        está, el agente lee «%{wrote}» como una instrucción más, y el árbol la marca en rojo.
      section_header_problem:
        no_closing_bracket: falta el «]» de cierre
        no_opening_bracket: falta el «[» de apertura
        extra_bracket: sobra un par de corchetes
      default_route_line_broken: >-
        Línea %{line}: el motor no lee esta ruta por defecto. Va así: @ruta_por_defecto: nombre_de_la_rama
        (con los dos puntos). Como está, los mensajes que no caen en ninguna ruta no van a ninguna.
      duplicate_section: >-
        La sección [%{title}] está dos veces (líneas %{first} y %{line}): el agente lee las dos y, si
        dicen cosas distintas, no sabe cuál vale. Júntalas en una.
      loose_pending_note: >-
        Línea %{line}: es una nota de trabajo («PENDIENTE: …») y el agente la va a leer como una
        instrucción. Resuélvela y bórrala, o escríbela como marca: <PENDIENTE: …>.
      bare_tag_line: >-
        Línea %{line}: %{tags} está suelta, sin decir qué significa. El agente la va a pegar a todas sus
        respuestas (pasó en una conversación real con #humano). Escríbela como diccionario —
        %{tags} = cuándo se usa— o bórrala: la etiqueta de cada ruta el motor la pone solo.
      state_label_not_found: >-
        La etiqueta %{tag} del Entrenamiento no existe en la cuenta: si el agente la usa, no dispara
        ninguna automatización. Créala en Etiquetas o cámbiala por una que exista.
      promised_action_missing:
        calendar: >-
          Línea %{line}: «%{route}» dice que agenda, mueve o cancela citas, pero el Entrenamiento no tiene
          @agendar_calendar en ninguna ruta. El agente lo va a prometer y nadie lo va a hacer. Agrega
          @agendar_calendar después de la flecha de esa ruta, o cambia lo que dice que hace.
        ticket: >-
          Línea %{line}: «%{route}» dice que abre un caso, pero el Entrenamiento no tiene @crear_ticket en
          ninguna ruta. El agente lo va a prometer y no se abre nada. Agrega @crear_ticket después de la
          flecha de esa ruta, o cambia lo que dice que hace.
      follow_up_promise: >-
        Línea %{line}: le pide al agente prometer algo para después («te confirmo en un momento», «lo
        estoy revisando»…). No hay seguimiento automático: el cliente se queda esperando. Escribe lo
        que sí pasa (se abre un caso, lo contacta una persona) o prohíbelo en [PROHIBIDO].
      section_ref_missing: >-
        Línea %{line}: «%{wrote}» cita la sección %{number}, y no hay ninguna sección [%{number}. …]. El
        agente no va a saber a dónde lo manda esa regla. Corrige el número o agrega la sección.
      section_ref_title: >-
        Línea %{line}: «%{wrote}» cita la sección %{number} con otro nombre: se llama «%{title}».
        Si se renumeró o se renombró, la referencia apunta a otra cosa. Corrígela.
      section_ref_part: >-
        Línea %{line}: «%{wrote}» cita «%{part}» dentro de la sección %{number} («%{title}»), y ahí no
        hay ninguna subsección ni renglón que empiece así. Puede que se haya movido o renombrado.
      section_ref_name: >-
        Línea %{line}: «%{wrote}» cita una sección que no existe en el Entrenamiento. El agente no va
        a encontrar a dónde lo manda esa regla. Corrige el nombre o agrega la sección.
      calendar_option_invalid: >-
        La ruta '%{route}' tiene «%{option}» en @agendar_calendar(…) y el motor no lo entiende: agenda
        con la duración y el horario de siempre. Opciones válidas: duracion=90 (minutos), duracion=2h,
        duracion=? (la dice el cliente) y horario=24h.
      paid_label_missing: >-
        La ruta '%{route}' pide el pago antes de confirmar (@confirmar_servicio(requiere=pago)): el
        servicio queda en firme cuando una persona le pone a la conversación la etiqueta «%{label}»,
        y la cuenta no la tiene. Créala; si no, el servicio se queda apartado.
      solicitudes_without_ticket: >-
        La ruta '%{route}' tiene @solicitudes pero no @crear_ticket después: cada servicio que pida el
        cliente se guarda como un caso, y sin @crear_ticket no hay dónde. Escríbelo así:
        @solicitudes -> @crear_ticket(tipo=Solicitud de transporte).
      solicitudes_without_lookup: >-
        La ruta '%{route}' agenda servicios pero no dice en qué hoja buscar el calendario de cada equipo:
        todos saldrán «no tengo ese equipo en el catálogo». Agrega después de la flecha, por ejemplo,
        {{hoja_buscar: Equipos | tipo=?; capacidad_t>=? | Calendar_ID}}.
      route_does_nothing: >-
        La ruta '%{route}' no consulta ninguna fuente y no tiene qué hacer si no resuelve: contesta solo
        con lo que dice el Entrenamiento. Ante algo concreto (precios, horarios) puede inventar o prometer
        lo que no hace. Si es a propósito (saludo, pedir datos), déjala así; si no, dale una fuente o un
        «si no resuelve» (abrir un caso, agendar).
      route_without_description: >-
        La ruta '%{route}' no tiene descripción. La descripción es LO ÚNICO que el clasificador usa
        para decidir a qué ruta va un mensaje: sin ella, esta ruta casi nunca se va a elegir.
        Escríbela como lista de situaciones, en las palabras del cliente.
      label_not_found: >-
        La etiqueta %{tag} de la ruta '%{route}' no existe en la cuenta, así que no va a disparar
        ninguna automatización. Hay que crearla en Etiquetas o usar una de las existentes: %{available}.
      label_none_created: (no hay etiquetas creadas)
      erp_directive_not_isolated: >-
        Hay una directiva {{consulta:}} sin "?" que no es la fuente de una ruta, conviviendo con rutas o
        con prosa. El motor manda el Entrenamiento ENTERO interpolado como mensaje al cliente. Ponla como
        fuente de una ruta, o pide sus datos con "?" (texto=?) para que el agente redacte la respuesta.
      sheet_lookup_invalid: >-
        Línea %{line}: a esta {{hoja_buscar:}} le falta una de sus tres partes. Se escribe
        {{hoja_buscar: Hoja | columna=valores | columna a regresar}}, separadas por «|». Así, el
        motor no la lee y la agenda no sabe en qué calendario buscar.
      sheet_lookup_sheet_missing: >-
        Línea %{line}: la hoja '%{name}' no existe (o está inactiva) en Base de Conocimiento. El
        motor no encuentra nada y la agenda no ofrece horarios. Revisa el nombre exacto de la hoja.
      sheet_lookup_column_missing: >-
        Línea %{line}: la hoja '%{name}' no tiene la columna %{columns}, así que nunca va a
        encontrar nada. Columnas que sí tiene: %{available}.
      sheet_lookup_no_rows: >-
        Línea %{line}: la hoja '%{name}' todavía no tiene sus filas guardadas para buscar exacto.
        Dale «Sincronizar ahora» en Base de Conocimiento; mientras, la agenda no ofrece horarios.
      consulta_not_found: >-
        La consulta '%{name}' no existe (o está inactiva) en la conexión '%{connection}'. El motor no
        falla: la corre, no encuentra nada y el agente contesta sin datos. Revisa el nombre en Base de
        Conocimiento → Conexión ERP, o siembra las consultas de la conexión.
      consulta_unknown_param: >-
        La consulta '%{name}' no tiene el parámetro %{params}: nunca se va a llenar. Parámetros que sí
        tiene: %{available}.
      # ⚠ Corregido el 10/09/2026 contra el motor real. Este mensaje decía que las rutas sin
      # flecha "dejan de abrir casos", y es al revés: el job las manda a
      # try_create_ticket(directive: nil), que cae al prompt ENTERO y encuentra ahí el
      # @crear_ticket de OTRA ruta. Abren caso, con el tipo ajeno, y ANTES de la fuente.
      mixed_escalation_regime: >-
        Hay rutas con escalamiento y rutas sin él (%{routes}). Eso NO las deja sin caso: el motor
        busca la directiva en el Entrenamiento entero, así que esas rutas van a abrir caso con el
        @crear_ticket de otra ruta —incluido su tipo— y además lo van a evaluar ANTES de consultar
        su fuente, no después. Si tienen que abrir caso, dales su propia flecha con su tipo; si no
        tienen que abrirlo, hoy no hay forma de evitarlo salvo sacar todo @crear_ticket suelto.
      calendar_not_configured: >-
        Esta cuenta no tiene ningún calendario de Google conectado, así que @agendar_calendar no va a
        agendar nada: la directiva parsea bien y el turno pasa de largo, sin aviso. Hay que conectar
        un calendario y además asignárselo a este Agente IA — con el calendario en la cuenta pero sin
        asignar al agente, tampoco agenda.
      # ⚠ Corregido el 11/09/2026: hasta ese día el motor BLANQUEABA el Entrenamiento entero
      # por esto y el aviso era bloqueante. develop lo arregló (strip_tokens conserva la prosa),
      # así que el mensaje ya no puede decir "borra la prosa": sería mentira.
      loose_directive: >-
        Línea %{line}: %{directive} está en la prosa, fuera de una línea @ruta, y ahí no se ejecuta:
        la búsqueda la hace el motor según la ruta del mensaje. El agente lee esa línea así:
        «%{as_read}». Para que la regla se entienda, nombra el resultado («la información
        consultada») en vez de la directiva, y pon %{directive} en la línea @ruta de las rutas que
        necesitan esos datos.
      attachment_with_source: >-
        El adjunto {{%{name}}} no se resuelve cuando la ruta consulta una fuente: sale como texto
        literal en el mensaje al cliente. Los adjuntos solo funcionan en rutas sin fuente.
      missing_prose_sections: >-
        A la prosa le faltan estas secciones: %{sections}. No rompen nada, pero cada una cubre una
        decisión que si no se escribe, el modelo la toma por su cuenta.
