<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="560" fill="#f4f6f9"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Estados del Seguimiento</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Agente de Seguimientos IA · ciclo de vida de un prospecto</text>

  <!-- Legend -->
  <text x="900" y="46" text-anchor="end" font-size="12" fill="#64748b"><tspan font-weight="700" fill="#7c3aed">★</tspan> éxito</text>
  <text x="900" y="64" text-anchor="end" font-size="12" fill="#64748b">⇄ vuelve a programarse</text>

  <!-- ================= ARROWS (drawn first, under boxes) ================= -->
  <!-- Pendiente -> Programado -->
  <line x1="196" y1="148" x2="244" y2="148" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <!-- Programado <-> Activo -->
  <line x1="406" y1="141" x2="454" y2="141" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="460" y1="156" x2="412" y2="156" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <!-- Activo -> Completado -->
  <line x1="616" y1="142" x2="710" y2="118" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <!-- Activo -> Objetivo cumplido -->
  <line x1="616" y1="156" x2="710" y2="194" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arwG)"/>
  <!-- Programado -> Pausado -->
  <line x1="328" y1="174" x2="328" y2="294" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="338" y="238" font-size="11.5" fill="#64748b">regla · bot · manual</text>
  <!-- Pausado -> Programado (reanudar) -->
  <path d="M406,318 C 486,300 486,196 372,176" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arw)"/>
  <text x="452" y="250" font-size="11.5" fill="#64748b">reanudar</text>
  <!-- Pausado -> Cancelado -->
  <line x1="328" y1="352" x2="328" y2="426" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <!-- Activo -> Fallido -->
  <line x1="538" y1="174" x2="546" y2="426" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="556" y="300" font-size="11.5" fill="#64748b">error de envío</text>

  <!-- ================= BOXES ================= -->
  <!-- Pendiente -->
  <g>
    <rect x="40" y="122" width="156" height="52" rx="9" fill="#eef1f5" stroke="#64748b" stroke-width="1.4"/>
    <circle cx="58" cy="142" r="4.5" fill="#64748b"/>
    <text x="72" y="146" font-size="14.5" font-weight="700" fill="#151b28">Pendiente</text>
    <text x="56" y="163" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#64748b">pending</text>
  </g>
  <!-- Programado -->
  <g>
    <rect x="250" y="122" width="156" height="52" rx="9" fill="#eaf1fe" stroke="#2563eb" stroke-width="1.4"/>
    <circle cx="268" cy="142" r="4.5" fill="#2563eb"/>
    <text x="282" y="146" font-size="14.5" font-weight="700" fill="#151b28">Programado</text>
    <text x="266" y="163" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2563eb">scheduled</text>
  </g>
  <!-- Activo -->
  <g>
    <rect x="460" y="122" width="156" height="52" rx="9" fill="#e7f7f0" stroke="#059669" stroke-width="1.4"/>
    <circle cx="478" cy="142" r="4.5" fill="#059669"/>
    <text x="492" y="146" font-size="14.5" font-weight="700" fill="#151b28">Activo</text>
    <text x="476" y="163" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#059669">active</text>
  </g>
  <!-- Completado -->
  <g>
    <rect x="716" y="92" width="186" height="52" rx="9" fill="#eceff3" stroke="#475569" stroke-width="1.4"/>
    <circle cx="734" cy="112" r="4.5" fill="#475569"/>
    <text x="748" y="116" font-size="14.5" font-weight="700" fill="#151b28">Completado</text>
    <text x="732" y="133" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#475569">completed</text>
  </g>
  <!-- Objetivo cumplido -->
  <g>
    <rect x="716" y="168" width="186" height="52" rx="9" fill="#f2ecfd" stroke="#7c3aed" stroke-width="1.6"/>
    <circle cx="734" cy="188" r="4.5" fill="#7c3aed"/>
    <text x="748" y="192" font-size="14" font-weight="700" fill="#151b28">Objetivo cumplido <tspan fill="#7c3aed">★</tspan></text>
    <text x="732" y="209" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c3aed">objective_met</text>
  </g>
  <!-- Pausado -->
  <g>
    <rect x="250" y="300" width="156" height="52" rx="9" fill="#fdf3e5" stroke="#d97706" stroke-width="1.4"/>
    <circle cx="268" cy="320" r="4.5" fill="#d97706"/>
    <text x="282" y="324" font-size="14.5" font-weight="700" fill="#151b28">Pausado</text>
    <text x="266" y="341" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#d97706">paused</text>
  </g>
  <!-- Cancelado -->
  <g>
    <rect x="250" y="432" width="156" height="52" rx="9" fill="#fdeaef" stroke="#be123c" stroke-width="1.4"/>
    <circle cx="268" cy="452" r="4.5" fill="#be123c"/>
    <text x="282" y="456" font-size="14.5" font-weight="700" fill="#151b28">Cancelado</text>
    <text x="266" y="473" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#be123c">cancelled</text>
  </g>
  <!-- Fallido -->
  <g>
    <rect x="470" y="432" width="156" height="52" rx="9" fill="#fdecec" stroke="#dc2626" stroke-width="1.4"/>
    <circle cx="488" cy="452" r="4.5" fill="#dc2626"/>
    <text x="502" y="456" font-size="14.5" font-weight="700" fill="#151b28">Fallido</text>
    <text x="486" y="473" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dc2626">failed</text>
  </g>

  <!-- Group captions -->
  <text x="40" y="516" font-size="12" fill="#8a94a3"><tspan font-weight="700" fill="#5c6675">En curso:</tspan> Pendiente · Programado · Activo · Pausado (el seguimiento sigue vivo)</text>
  <text x="40" y="536" font-size="12" fill="#8a94a3"><tspan font-weight="700" fill="#5c6675">Finales:</tspan> Completado · Objetivo cumplido · Cancelado · Fallido (no vuelve a enviar)</text>
</svg>
