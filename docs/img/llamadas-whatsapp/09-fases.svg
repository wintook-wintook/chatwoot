    <g><rect x="480" y="100" width="200" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="496" y="126" font-weight="800" fill="#151b28">F3 · Servicios + API</text><text x="496" y="148" fill="#5c6675">entrante, saliente,</text><text x="496" y="164" fill="#5c6675">permiso, controlador</text></g>
    <g><rect x="700" y="100" width="200" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="716" y="126" font-weight="800" fill="#151b28">F4 · Simulador</text><text x="716" y="148" fill="#5c6675">Meta simulada +</text><text x="716" y="164" fill="#5c6675">pestaña cliente</text></g>
    <g><rect x="700" y="210" width="200" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="716" y="236" font-weight="800" fill="#151b28">F5 · Cable + WebRTC</text><text x="716" y="258" fill="#5c6675">Vuex calls, widget,</text><text x="716" y="274" fill="#5c6675">burbuja, botón Llamar</text></g>
    <g><rect x="480" y="210" width="200" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="496" y="236" font-weight="800" fill="#151b28">F6 · Configuración</text><text x="496" y="258" fill="#5c6675">dirección, timbre,</text><text x="496" y="274" fill="#5c6675">pestaña Llamadas</text></g>
    <g><rect x="260" y="210" width="200" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="276" y="236" font-weight="800" fill="#151b28">F7 · Grabación</text><text x="276" y="258" fill="#5c6675">MediaRecorder, adjunto,</text><text x="276" y="274" fill="#5c6675">aviso al cliente</text></g>
    <g><rect x="40" y="210" width="200" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="56" y="236" font-weight="800" fill="#151b28">F8 · Llamada perdida</text><text x="56" y="258" fill="#5c6675">timeout 60 s + nota,</text><text x="56" y="274" fill="#5c6675">etiqueta, ticket, seguim.</text></g>
    <g><rect x="40" y="320" width="420" height="80" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="56" y="346" font-weight="800" fill="#151b28">F0 · Requisitos Meta (cuando haya número)</text><text x="56" y="368" fill="#5c6675">elegibilidad, países, costo, activar calling</text></g>
