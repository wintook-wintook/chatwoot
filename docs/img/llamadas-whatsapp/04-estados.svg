<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="940" height="400" fill="#f4f6f9"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28">Estados de una llamada</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Tabla calls · columna status · los cuatro de la derecha son finales</text>
  <rect x="40" y="170" width="150" height="56" rx="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="115" y="204" font-size="16" font-weight="800" fill="#92400e" text-anchor="middle">ringing</text>
  <rect x="380" y="170" width="170" height="56" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="204" font-size="16" font-weight="800" fill="#1e40af" text-anchor="middle">in_progress</text>
  <g font-size="15" font-weight="800" text-anchor="middle">
    <rect x="720" y="96" width="170" height="44" rx="22" fill="#dcfce7" stroke="#16a34a"/><text x="805" y="124" fill="#166534">completed</text>
    <rect x="720" y="160" width="170" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/><text x="805" y="188" fill="#334155">no_answer</text>
    <rect x="720" y="224" width="170" height="44" rx="22" fill="#fee2e2" stroke="#dc2626"/><text x="805" y="252" fill="#991b1b">rejected</text>
    <rect x="720" y="288" width="170" height="44" rx="22" fill="#fee2e2" stroke="#dc2626"/><text x="805" y="316" fill="#991b1b">failed</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M192,198 H376"/><path d="M552,190 C640,150 650,118 716,118"/><path d="M552,206 C640,260 660,310 716,310"/>
    <path d="M115,168 C115,120 600,120 716,180"/><path d="M115,228 C115,250 600,246 716,246"/><path d="M115,228 C115,330 600,320 716,312"/>
  </g>
  <g font-size="11.5" fill="#151b28">
    <text x="284" y="190" text-anchor="middle">contestó (entrante: clic)</text>
    <text x="284" y="216" text-anchor="middle">(saliente: ACCEPTED)</text>
    <text x="640" y="134">colgaron</text>
    <text x="560" y="262">error de Meta</text>
    <text x="330" y="120" text-anchor="middle">cliente colgó / timeout 60 s / agente colgó antes</text>
    <text x="330" y="236" text-anchor="middle">agente rechazó</text>
    <text x="330" y="336" text-anchor="middle">terminate con razón de error</text>
  </g>
  <text x="40" y="372" font-size="12.5" fill="#151b28"><tspan font-weight="700">Llamada perdida</tspan> = entrante en no_answer, o terminada sin que ningún agente la tomara → dispara la acción configurada</text>
</svg>
