<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="580" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Dónde vive el costo en CONTPAQi</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Cuatro estructuras, cuatro responsabilidades · verificado en adPanchitos_Corp</text>

  <!-- Origen: movimientos -->
  <rect x="310" y="96" width="320" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="126" font-size="16" font-weight="700" fill="#151b28">admMovimientos</text>
  <text x="330" y="148" font-size="11.5" fill="#5c6675">renglón de documento · CCOSTOCAPTURADO</text>
  <text x="330" y="165" font-size="11.5" fill="#5c6675">CCOSTOESPECIFICO</text>
  <text x="612" y="126" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="end">1 047 filas</text>

  <text x="482" y="200" font-size="11" fill="#5c6675" font-style="italic">recalcula</text>
  <path d="M470,176 L470,214" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M170,214 L780,214" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M170,214 L170,252" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path d="M470,214 L470,252" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path d="M780,214 L780,252" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>

  <!-- Card A: bitacora -->
  <rect x="45" y="258" width="250" height="168" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="45" y="258" width="250" height="30" rx="10" fill="#7c3aed"/>
  <rect x="45" y="276" width="250" height="12" fill="#7c3aed"/>
  <text x="61" y="279" font-size="13.5" font-weight="700" fill="#ffffff">admCostosHistoricos</text>
  <text x="61" y="312" font-size="11.5" font-weight="700" fill="#5b21b6">BITÁCORA punto-en-tiempo</text>
  <text x="61" y="334" font-size="11.5" fill="#5c6675">grano: producto × almacén × momento</text>
  <text x="61" y="352" font-size="11.5" fill="#5c6675">1 fila por recálculo de costo</text>
  <text x="61" y="376" font-size="11.5" font-weight="600" fill="#151b28">→ ¿cuánto costaba el 24-jul?</text>
  <text x="61" y="404" font-size="11.5" font-weight="700" fill="#7c3aed">82 filas · 2022-06 → 2026-08</text>

  <!-- Card B: acumulado -->
  <rect x="345" y="258" width="250" height="168" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="345" y="258" width="250" height="30" rx="10" fill="#0284c7"/>
  <rect x="345" y="276" width="250" height="12" fill="#0284c7"/>
  <text x="361" y="279" font-size="13.5" font-weight="700" fill="#ffffff">admExistenciaCosto</text>
  <text x="361" y="312" font-size="11.5" font-weight="700" fill="#075985">ACUMULADO por ejercicio</text>
  <text x="361" y="334" font-size="11.5" fill="#5c6675">grano: producto × almacén × ejercicio</text>
  <text x="361" y="352" font-size="11.5" fill="#5c6675">59 columnas: iniciales + 12 periodos</text>
  <text x="361" y="376" font-size="11.5" font-weight="600" fill="#151b28">→ ¿cuánto vale hoy?</text>
  <text x="361" y="404" font-size="11.5" font-weight="700" fill="#0284c7">369 filas · ejercicios 2022-2027</text>

  <!-- Card C: capas -->
  <rect x="645" y="258" width="250" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="645" y="258" width="250" height="30" rx="10" fill="#94a3b8"/>
  <rect x="645" y="276" width="250" height="12" fill="#94a3b8"/>
  <text x="661" y="279" font-size="13.5" font-weight="700" fill="#ffffff">admCapasProducto</text>
  <text x="661" y="312" font-size="11.5" font-weight="700" fill="#475569">CAPAS PEPS / UEPS / específico</text>
  <text x="661" y="334" font-size="11.5" fill="#5c6675">grano: capa individual de inventario</text>
  <text x="661" y="352" font-size="11.5" fill="#5c6675">lote, caducidad, pedimento aduanal</text>
  <text x="661" y="376" font-size="11.5" font-weight="600" fill="#151b28">→ costo de salida por capa</text>
  <text x="661" y="404" font-size="11.5" font-weight="700" fill="#dc2626">0 filas — no se usa aquí</text>

  <!-- Nota derivacion -->
  <rect x="45" y="450" width="850" height="58" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="66" y="475" font-size="12.5" font-weight="700" fill="#92400e">admProductos NO tiene columna CCOSTOPROMEDIO</text>
  <text x="66" y="495" font-size="11.5" fill="#78350f">El costo promedio vigente se DERIVA de admExistenciaCosto. Ahí solo viven CCOSTOESTANDAR, CCOSTOEXT1..5 y CERRORCOSTO.</text>

  <text x="45" y="540" font-size="12" fill="#5c6675">Sin triggers ni stored procedures de costeo: todo el cálculo lo hace la aplicación CONTPAQi, la base solo persiste resultados.</text>
</svg>
