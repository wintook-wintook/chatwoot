<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="640" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Cuándo se escribe una fila de costo histórico</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">El disparador es el movimiento de inventario, no el documento · conteos reales de adPanchitos_Corp</text>

  <!-- ===== Bloque NO costean ===== -->
  <rect x="40" y="92" width="860" height="118" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <text x="62" y="120" font-size="14" font-weight="700" fill="#b91c1c">NO generan fila de costo</text>

  <rect x="62" y="136" width="152" height="34" rx="17" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="138" y="158" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">Cotización</text>
  <rect x="228" y="136" width="152" height="34" rx="17" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="304" y="158" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">Pedido</text>
  <rect x="394" y="136" width="180" height="34" rx="17" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="484" y="158" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">Factura al Contado</text>

  <path d="M590,153 L628,153" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#a2r)"/>
  <text x="640" y="150" font-size="12" font-weight="700" fill="#b91c1c">sin fila en admCostosHistoricos</text>
  <text x="640" y="168" font-size="11" fill="#7f1d1d">sigue el flujo físico, no el de facturación</text>
  <text x="62" y="192" font-size="11.5" fill="#5c6675">Producto 45: 24 movimientos → solo 6 filas de costo. Cotizaciones, pedidos y facturas no tocaron el costo.</text>

  <!-- ===== Bloque SI costean ===== -->
  <rect x="40" y="232" width="860" height="300" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="62" y="260" font-size="14" font-weight="700" fill="#15803d">SÍ generan fila de costo</text>

  <!-- Fila ENTRADA -->
  <rect x="62" y="278" width="230" height="94" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="80" y="302" font-size="12.5" font-weight="700" fill="#14532d">ENTRADA</text>
  <text x="80" y="324" font-size="11.5" fill="#166534">Compra · 16 filas</text>
  <text x="80" y="342" font-size="11.5" fill="#166534">Entrada al Almacén · 14 filas</text>
  <text x="80" y="362" font-size="11" fill="#5c6675">naturaleza 1 y 2</text>

  <path d="M292,325 L360,325" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <text x="326" y="316" font-size="11" fill="#5c6675" text-anchor="middle">escribe</text>
  <text x="326" y="345" font-size="12" font-weight="800" fill="#151b28" text-anchor="middle">2 filas</text>

  <rect x="372" y="278" width="248" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="388" y="296" font-size="12" font-weight="700" fill="#5b21b6">CIDALMACEN = 0</text>
  <text x="388" y="313" font-size="11" fill="#5c6675">costo a nivel empresa (consolidado)</text>

  <rect x="372" y="330" width="248" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="388" y="348" font-size="12" font-weight="700" fill="#5b21b6">CIDALMACEN = almacén del mov.</text>
  <text x="388" y="365" font-size="11" fill="#5c6675">costo a nivel almacén</text>

  <rect x="640" y="278" width="242" height="94" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="300" font-size="11.5" font-weight="700" fill="#151b28">Verificado</text>
  <text x="656" y="320" font-size="11" fill="#5c6675">Los 19 movimientos con más de una</text>
  <text x="656" y="337" font-size="11" fill="#5c6675">fila tienen SIEMPRE el 0 entre ellas.</text>
  <text x="656" y="358" font-size="11" fill="#5c6675">Compra: 8 filas alm 0 + 8 filas alm 1</text>

  <!-- Fila SALIDA -->
  <rect x="62" y="398" width="230" height="94" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="80" y="422" font-size="12.5" font-weight="700" fill="#14532d">SALIDA</text>
  <text x="80" y="444" font-size="11.5" fill="#166534">Remisión · 42 filas</text>
  <text x="80" y="464" font-size="11" fill="#5c6675">naturaleza 2</text>

  <path d="M292,445 L360,445" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <text x="326" y="436" font-size="11" fill="#5c6675" text-anchor="middle">escribe</text>
  <text x="326" y="465" font-size="12" font-weight="800" fill="#151b28" text-anchor="middle">1 fila</text>

  <rect x="372" y="420" width="248" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="388" y="440" font-size="12" font-weight="700" fill="#92400e">CIDALMACEN = 2 (constante)</text>
  <text x="388" y="457" font-size="11" fill="#78350f">no correlaciona con el almacén real</text>

  <rect x="640" y="398" width="242" height="94" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="656" y="420" font-size="11.5" font-weight="700" fill="#92400e">Anomalía sin explicar</text>
  <text x="656" y="440" font-size="11" fill="#78350f">31 remisiones desde el almacén 1 y</text>
  <text x="656" y="457" font-size="11" fill="#78350f">11 desde el 3 → las 42 escriben "2".</text>
  <text x="656" y="478" font-size="11" font-weight="600" fill="#78350f">No lo trates como FK a admAlmacenes.</text>

  <!-- ===== Pie ===== -->
  <rect x="40" y="552" width="860" height="62" rx="8" fill="#ffffff" stroke="#dbe1ea"/>
  <text x="62" y="576" font-size="11.5" fill="#151b28"><tspan font-weight="700">Granularidad:</tspan> la fila se ancla al MOVIMIENTO (CIDMOVIMIENTO), no al documento. N renglones costeables → hasta N × (1 ó 2) filas.</text>
  <text x="62" y="598" font-size="11.5" fill="#151b28"><tspan font-weight="700">Integridad:</tspan> CIDMOVIMIENTO nunca es huérfano · pero 10 de 82 filas apuntan a movimientos con CIDDOCUMENTO = 0 → usa LEFT JOIN.</text>
</svg>
