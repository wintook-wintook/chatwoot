<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 786" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="1000" height="786" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Catálogo de capacidades del Agente IA</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Las 11 directivas que hoy entiende el motor · el Registry es la fuente única de verdad para chat, linter y probador</text>

  <!-- ================= LANE A: KBASE ================= -->
  <rect x="40" y="92" width="920" height="252" rx="12" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="40" y="92" width="920" height="4" rx="2" fill="#dc2626"/>
  <text x="64" y="124" font-size="15" font-weight="800" fill="#151b28">A · Fuentes de conocimiento</text>
  <rect x="316" y="110" width="342" height="20" rx="10" fill="#fef2f2"/>
  <text x="331" y="124" font-size="11" font-weight="700" fill="#b91c1c">EXCLUYENTES · SOLO UNA RESUELVE EL TURNO</text>
  <text x="936" y="124" text-anchor="end" font-size="11.5" fill="#94a3b8">elige exactamente una</text>

  <rect x="64" y="142" width="286" height="86" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="82" y="167" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">@buscar_predefinidas</text>
  <text x="82" y="188" font-size="11.5" fill="#5c6675">Respuestas predefinidas de la cuenta</text>
  <text x="82" y="205" font-size="11.5" fill="#5c6675">pgvector local · umbral 0.20 · 3 máx.</text>
  <rect x="82" y="212" width="152" height="18" rx="9" fill="#fee2e2"/>
  <text x="92" y="225" font-size="10.5" font-weight="700" fill="#b91c1c">OpenAI · ANULA EL PROMPT</text>

  <rect x="366" y="142" width="286" height="86" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="384" y="167" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">@buscar_articulo</text>
  <text x="384" y="188" font-size="11.5" fill="#5c6675">Artículos del Centro de Ayuda</text>
  <text x="384" y="205" font-size="11.5" fill="#5c6675">pgvector local sobre knowledge_items</text>
  <rect x="384" y="212" width="152" height="18" rx="9" fill="#fee2e2"/>
  <text x="394" y="225" font-size="10.5" font-weight="700" fill="#b91c1c">OpenAI · ANULA EL PROMPT</text>

  <rect x="668" y="142" width="268" height="86" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="686" y="167" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">@buscar_foro(fuente)</text>
  <text x="686" y="188" font-size="11.5" fill="#5c6675">Discourse AI, búsqueda en vivo</text>
  <text x="686" y="205" font-size="11.5" fill="#5c6675">por KnowledgeSource con nombre</text>
  <rect x="686" y="212" width="150" height="18" rx="9" fill="#fee2e2"/>
  <text x="696" y="225" font-size="10.5" font-weight="700" fill="#b91c1c">Source · ANULA EL PROMPT</text>

  <rect x="64" y="240" width="286" height="86" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="82" y="265" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">{{doc:Nombre}}</text>
  <text x="82" y="286" font-size="11.5" fill="#5c6675">Documento de Google Docs</text>
  <text x="82" y="303" font-size="11.5" fill="#5c6675">lectura en vivo del contenido</text>
  <rect x="82" y="310" width="216" height="18" rx="9" fill="#dcfce7"/>
  <text x="92" y="323" font-size="10.5" font-weight="700" fill="#166534">google_calendar · CONSERVA EL PROMPT</text>

  <rect x="366" y="240" width="286" height="86" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="384" y="265" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">{{hoja:Nombre}}</text>
  <text x="384" y="286" font-size="11.5" fill="#5c6675">Hoja de Google Sheets</text>
  <text x="384" y="303" font-size="11.5" fill="#5c6675">modo Datos: cálculos exactos</text>
  <rect x="384" y="310" width="216" height="18" rx="9" fill="#dcfce7"/>
  <text x="394" y="323" font-size="10.5" font-weight="700" fill="#166534">google_calendar · CONSERVA EL PROMPT</text>

  <rect x="668" y="240" width="268" height="86" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="686" y="265" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">@discourse</text>
  <text x="686" y="286" font-size="11.5" fill="#5c6675">Foro Discourse por la integración</text>
  <text x="686" y="303" font-size="11.5" fill="#5c6675">configurada en el propio inbox</text>
  <rect x="686" y="310" width="176" height="18" rx="9" fill="#fee2e2"/>
  <text x="696" y="323" font-size="10.5" font-weight="700" fill="#b91c1c">inbox · ANULA EL PROMPT</text>

  <!-- ================= LANE B: INTERPOLACIÓN ================= -->
  <rect x="40" y="362" width="920" height="118" rx="12" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="40" y="362" width="920" height="4" rx="2" fill="#2563eb"/>
  <text x="64" y="394" font-size="15" font-weight="800" fill="#151b28">B · Plantilla con datos del ERP</text>
  <rect x="334" y="380" width="312" height="20" rx="10" fill="#eff6ff"/>
  <text x="349" y="394" font-size="11" font-weight="700" fill="#1d4ed8">PRIORIDAD ABSOLUTA · EL PROMPT SE ENVÍA LITERAL</text>

  <rect x="64" y="410" width="286" height="56" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="82" y="434" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">{{consulta:conn/nombre(args)}}</text>
  <rect x="82" y="444" width="142" height="18" rx="9" fill="#fef3c7"/>
  <text x="92" y="457" font-size="10.5" fill="#92400e">feature erp_connection</text>

  <text x="372" y="428" font-size="12" fill="#5c6675">Sustituye cada ocurrencia por el resultado de una consulta al ERP</text>
  <text x="372" y="446" font-size="12" fill="#5c6675">(Contpaq · SAE · Microsip). Es determinista: no pasa por el modelo.</text>
  <text x="372" y="464" font-size="12" font-weight="700" fill="#b45309">T9: el prompt deja de ser instrucciones y se envía tal cual al cliente.</text>

  <!-- ================= LANE C: BANDERAS ================= -->
  <rect x="40" y="498" width="920" height="146" rx="12" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="40" y="498" width="920" height="4" rx="2" fill="#7c3aed"/>
  <text x="64" y="530" font-size="15" font-weight="800" fill="#151b28">C · Banderas de acción</text>
  <rect x="284" y="516" width="330" height="20" rx="10" fill="#f5f3ff"/>
  <text x="299" y="530" font-size="11" font-weight="700" fill="#6d28d9">NO SON INSTRUCCIONES: EL MOTOR LAS LEE Y LAS BORRA</text>

  <rect x="64" y="546" width="286" height="80" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="82" y="570" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">@agendar_calendar</text>
  <text x="82" y="590" font-size="11.5" fill="#5c6675">Habilita agendar en calendario</text>
  <text x="82" y="607" font-size="11.5" fill="#5c6675">Se elimina del texto antes del LLM</text>
  <rect x="82" y="612" width="182" height="18" rx="9" fill="#eef1f5"/>
  <text x="92" y="625" font-size="10.5" fill="#64748b">requiere calendar_integration_ids</text>

  <rect x="366" y="546" width="286" height="80" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="384" y="570" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">@crear_ticket(tipo)</text>
  <text x="384" y="590" font-size="11.5" fill="#5c6675">Levanta un ticket del módulo</text>
  <text x="384" y="607" font-size="11.5" fill="#5c6675">Tickets con el tipo indicado</text>
  <rect x="384" y="612" width="144" height="18" rx="9" fill="#eef1f5"/>
  <text x="394" y="625" font-size="10.5" fill="#64748b">requiere módulo Tickets</text>

  <rect x="668" y="546" width="268" height="80" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="686" y="570" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">@estado_ticket</text>
  <text x="686" y="590" font-size="11.5" fill="#5c6675">Responde el estado del ticket</text>
  <text x="686" y="607" font-size="11.5" fill="#5c6675">cuando el cliente pregunta</text>
  <rect x="686" y="612" width="144" height="18" rx="9" fill="#eef1f5"/>
  <text x="696" y="625" font-size="10.5" fill="#64748b">requiere módulo Tickets</text>

  <!-- ================= LANE D: ADJUNTOS ================= -->
  <rect x="40" y="662" width="920" height="104" rx="12" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="40" y="662" width="920" height="4" rx="2" fill="#059669"/>
  <text x="64" y="694" font-size="15" font-weight="800" fill="#151b28">D · Envío de archivos</text>

  <rect x="64" y="708" width="286" height="42" rx="8" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="82" y="734" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-monospace, Menlo, Consolas, monospace">{{nombre_archivo}}</text>

  <rect x="366" y="708" width="570" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="384" y="726" font-size="11.5" font-weight="700" fill="#b91c1c">⚠  La regex es /\{\{\s*([a-zA-Z0-9_-]+)\s*\}\}/ — captura CUALQUIER llave sin dos puntos.</text>
  <text x="384" y="743" font-size="11.5" fill="#7f1d1d">Si escribes {{empresa}} pensando en una variable, el motor busca un archivo y borra el texto.</text>
</svg>
