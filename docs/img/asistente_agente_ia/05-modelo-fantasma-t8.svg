<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 526" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="526" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">T8 · El selector de modelo que nadie lee</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">La integración tracking_bot pide un modelo por inbox, lo valida y lo guarda. Ningún archivo Ruby lo consulta.</text>

  <!-- ============ HOY ============ -->
  <rect x="40" y="92" width="450" height="392" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <rect x="64" y="112" width="58" height="22" rx="11" fill="#dc2626"/>
  <text x="93" y="127" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">HOY</text>
  <text x="136" y="128" font-size="13" font-weight="800" fill="#151b28">Configuración fantasma</text>

  <rect x="64" y="148" width="402" height="88" rx="9" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="84" y="171" font-size="11" font-weight="700" fill="#5c6675">/settings/integrations/tracking_bot</text>
  <text x="84" y="192" font-size="11.5" fill="#64748b">Modelo de IA</text>
  <rect x="84" y="200" width="362" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="98" y="217" font-size="11" font-weight="700" fill="#1e293b">GPT-4o · inteligencia ●●●●● · costo ●●●</text>
  <text x="432" y="217" font-size="11" fill="#94a3b8">▾</text>

  <path d="M265,236 L265,262" stroke="#059669" stroke-width="2" marker-end="url(#a5g)" fill="none"/>
  <text x="278" y="254" font-size="11" fill="#059669">se guarda bien en el hook</text>

  <rect x="64" y="268" width="402" height="46" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="84" y="290" font-size="11.5" font-weight="700" fill="#047857" font-family="ui-monospace, Menlo, Consolas, monospace">hook.settings['model_ia'] = 'gpt-4o'</text>
  <text x="84" y="306" font-size="10.5" fill="#059669">app_id: tracking_bot · hook_type: inbox · required</text>

  <path d="M265,314 L265,344" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a5r)" fill="none"/>
  <text x="278" y="336" font-size="11" font-weight="700" fill="#dc2626">nadie lo lee jamás</text>

  <rect x="64" y="350" width="402" height="112" rx="9" fill="#fef2f2" stroke="#fecaca"/>
  <text x="84" y="372" font-size="11.5" font-weight="800" fill="#b91c1c">Los 5 puntos de llamada, todos literales</text>
  <text x="84" y="392" font-size="10.5" fill="#7f1d1d" font-family="ui-monospace, Menlo, Consolas, monospace">contact_tracking_job.rb:286</text>
  <text x="84" y="408" font-size="10.5" fill="#7f1d1d" font-family="ui-monospace, Menlo, Consolas, monospace">..._response_analyzer_job.rb:1079  ·  :1605</text>
  <text x="84" y="424" font-size="10.5" fill="#7f1d1d" font-family="ui-monospace, Menlo, Consolas, monospace">router_service.rb:208</text>
  <text x="84" y="440" font-size="10.5" fill="#7f1d1d" font-family="ui-monospace, Menlo, Consolas, monospace">commands/sigue.rb:395</text>
  <rect x="330" y="424" width="122" height="24" rx="12" fill="#dc2626"/>
  <text x="391" y="440" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">→ gpt-4o-mini</text>

  <!-- ============ CON F0 ============ -->
  <rect x="510" y="92" width="450" height="392" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="534" y="112" width="76" height="22" rx="11" fill="#059669"/>
  <text x="572" y="127" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">CON F0</text>
  <text x="624" y="128" font-size="13" font-weight="800" fill="#151b28">El selector manda de verdad</text>

  <rect x="534" y="148" width="402" height="88" rx="9" fill="#fafbfc" stroke="#e6eaf0"/>
  <text x="554" y="171" font-size="11" font-weight="700" fill="#5c6675">/settings/integrations/tracking_bot</text>
  <text x="554" y="192" font-size="11.5" fill="#64748b">Modelo de IA</text>
  <rect x="554" y="200" width="362" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="568" y="217" font-size="11" font-weight="700" fill="#1e293b">GPT-4o · inteligencia ●●●●● · costo ●●●</text>
  <text x="902" y="217" font-size="11" fill="#94a3b8">▾</text>

  <path d="M735,236 L735,262" stroke="#059669" stroke-width="2" marker-end="url(#a5g)" fill="none"/>

  <rect x="534" y="268" width="402" height="72" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="554" y="290" font-size="11.5" font-weight="800" fill="#6d28d9">AiAgentAssistant::EngineConfig</text>
  <text x="554" y="309" font-size="10.5" fill="#5b21b6" font-family="ui-monospace, Menlo, Consolas, monospace">model_for(inbox, purpose)</text>
  <text x="554" y="325" font-size="10.5" fill="#5b21b6" font-family="ui-monospace, Menlo, Consolas, monospace">max_tokens_for(purpose)</text>
  <text x="760" y="309" font-size="10.5" fill="#7c3aed">resuelve por inbox,</text>
  <text x="760" y="325" font-size="10.5" fill="#7c3aed">con fallback al default</text>

  <path d="M660,340 L660,368" stroke="#059669" stroke-width="2" marker-end="url(#a5g)" fill="none"/>
  <path d="M810,340 L810,368" stroke="#059669" stroke-width="2" marker-end="url(#a5g)" fill="none"/>

  <rect x="534" y="374" width="188" height="88" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="554" y="396" font-size="11.5" font-weight="800" fill="#047857">Motor</text>
  <text x="554" y="416" font-size="10.5" fill="#059669">Los 5 puntos leen de aquí.</text>
  <text x="554" y="432" font-size="10.5" fill="#059669">El agente corre en GPT-4o</text>
  <text x="554" y="448" font-size="10.5" fill="#059669">porque tú lo elegiste.</text>

  <rect x="734" y="374" width="202" height="88" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="754" y="396" font-size="11.5" font-weight="800" fill="#1d4ed8">Probador</text>
  <text x="754" y="416" font-size="10.5" fill="#2563eb">Usa el mismo EngineConfig,</text>
  <text x="754" y="432" font-size="10.5" fill="#2563eb">nunca una constante propia.</text>
  <text x="754" y="448" font-size="10.5" fill="#2563eb">Simula lo que de verdad pasa.</text>
</svg>
