<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 706" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="706" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Cómo se resuelve una directiva</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">KnowledgeBaseResponseService#detect_directive · cadena if/elsif: gana la primera, las demás son texto muerto</text>

  <!-- ============ PROMPT CARD ============ -->
  <rect x="40" y="100" width="330" height="238" rx="10" fill="#ffffff" stroke="#d7dce4"/>
  <text x="60" y="126" font-size="11.5" font-weight="700" fill="#5c6675" letter-spacing="0.5">COMPLEMENTARY_PROMPT</text>
  <text x="60" y="153" font-size="12.5" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">[ROL Y LÍMITES]</text>
  <text x="60" y="173" font-size="12.5" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">Eres un asesor de cobranza…</text>
  <text x="60" y="205" font-size="13" font-weight="700" fill="#059669" font-family="ui-monospace, Menlo, Consolas, monospace">@buscar_predefinidas</text>
  <text x="60" y="231" font-size="13" font-weight="700" fill="#dc2626" font-family="ui-monospace, Menlo, Consolas, monospace">@discourse</text>
  <text x="60" y="257" font-size="13" font-weight="700" fill="#dc2626" font-family="ui-monospace, Menlo, Consolas, monospace">{{doc:Catálogo 2026}}</text>
  <text x="60" y="289" font-size="12.5" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">…8 000 caracteres más</text>
  <line x1="60" y1="305" x2="350" y2="305" stroke="#eef1f5"/>
  <text x="60" y="324" font-size="11.5" fill="#64748b">El autor puso 3 directivas. Solo una va a existir.</text>

  <path d="M370,219 L412,219" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)" fill="none"/>

  <!-- ============ LADDER ============ -->
  <text x="430" y="118" font-size="13" font-weight="800" fill="#151b28">Escalera de precedencia</text>

  <!-- row 0 -->
  <rect x="430" y="130" width="530" height="46" rx="8" fill="#ffffff" stroke="#d7dce4"/>
  <circle cx="456" cy="153" r="13" fill="#eef1f5"/>
  <text x="456" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">1</text>
  <text x="480" y="149" font-size="13" font-weight="700" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">{{consulta:…}}</text>
  <text x="480" y="166" font-size="11" fill="#94a3b8">prioridad absoluta · el prompt se envía LITERAL al cliente (T9)</text>
  <text x="944" y="158" text-anchor="end" font-size="11" fill="#94a3b8">ausente</text>

  <!-- row 1 WINNER -->
  <rect x="430" y="182" width="530" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="456" cy="205" r="13" fill="#059669"/>
  <text x="456" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="480" y="201" font-size="13" font-weight="700" fill="#065f46" font-family="ui-monospace, Menlo, Consolas, monospace">@buscar_predefinidas</text>
  <text x="480" y="218" font-size="11" fill="#059669">pgvector sobre knowledge_items · umbral 0.20 · 3 resultados</text>
  <text x="944" y="210" text-anchor="end" font-size="11.5" font-weight="800" fill="#059669">✓ GANA</text>

  <!-- row 2 -->
  <rect x="430" y="234" width="530" height="46" rx="8" fill="#ffffff" stroke="#d7dce4"/>
  <circle cx="456" cy="257" r="13" fill="#eef1f5"/>
  <text x="456" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">3</text>
  <text x="480" y="253" font-size="13" font-weight="700" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">@buscar_articulo</text>
  <text x="480" y="270" font-size="11" fill="#94a3b8">artículos del Centro de Ayuda</text>
  <text x="944" y="262" text-anchor="end" font-size="11" fill="#94a3b8">ausente</text>

  <!-- row 3 -->
  <rect x="430" y="286" width="530" height="46" rx="8" fill="#ffffff" stroke="#d7dce4"/>
  <circle cx="456" cy="309" r="13" fill="#eef1f5"/>
  <text x="456" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">4</text>
  <text x="480" y="305" font-size="13" font-weight="700" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">@buscar_foro(fuente)</text>
  <text x="480" y="322" font-size="11" fill="#94a3b8">Discourse AI en vivo vía KnowledgeSource</text>
  <text x="944" y="314" text-anchor="end" font-size="11" fill="#94a3b8">ausente</text>

  <!-- row 4 IGNORED -->
  <rect x="430" y="338" width="530" height="46" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <circle cx="456" cy="361" r="13" fill="#fecaca"/>
  <text x="456" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">5</text>
  <text x="480" y="357" font-size="13" font-weight="700" fill="#b91c1c" font-family="ui-monospace, Menlo, Consolas, monospace" text-decoration="line-through">{{doc:Catálogo 2026}}</text>
  <text x="480" y="374" font-size="11" fill="#dc2626">está en el prompt, pero nunca se evalúa</text>
  <text x="944" y="366" text-anchor="end" font-size="11.5" font-weight="800" fill="#dc2626">✕ IGNORADA</text>

  <!-- row 5 -->
  <rect x="430" y="390" width="530" height="46" rx="8" fill="#ffffff" stroke="#d7dce4"/>
  <circle cx="456" cy="413" r="13" fill="#eef1f5"/>
  <text x="456" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">6</text>
  <text x="480" y="409" font-size="13" font-weight="700" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">{{hoja:Nombre}}</text>
  <text x="480" y="426" font-size="11" fill="#94a3b8">Google Sheet · requiere feature google_calendar</text>
  <text x="944" y="418" text-anchor="end" font-size="11" fill="#94a3b8">ausente</text>

  <!-- row 6 IGNORED -->
  <rect x="430" y="442" width="530" height="46" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <circle cx="456" cy="465" r="13" fill="#fecaca"/>
  <text x="456" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">7</text>
  <text x="480" y="461" font-size="13" font-weight="700" fill="#b91c1c" font-family="ui-monospace, Menlo, Consolas, monospace" text-decoration="line-through">@discourse</text>
  <text x="480" y="478" font-size="11" fill="#dc2626">está en el prompt, pero nunca se evalúa</text>
  <text x="944" y="470" text-anchor="end" font-size="11.5" font-weight="800" fill="#dc2626">✕ IGNORADA</text>

  <path d="M695,494 L695,524" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)" fill="none"/>

  <!-- ============ CONSEQUENCE ============ -->
  <rect x="40" y="530" width="920" height="146" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="64" y="558" font-size="14" font-weight="800" fill="#9a3412">⚠  Y ahora la parte que nadie espera</text>

  <rect x="64" y="574" width="430" height="86" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="84" y="598" font-size="12" font-weight="700" fill="#9a3412">T3 · Las otras dos no existen</text>
  <text x="84" y="618" font-size="11.5" fill="#7c2d12">Al ser una cadena if/elsif, en cuanto una coincide</text>
  <text x="84" y="635" font-size="11.5" fill="#7c2d12">se sale. El resto queda como texto suelto dentro</text>
  <text x="84" y="652" font-size="11.5" fill="#7c2d12">del prompt, sin efecto alguno.</text>

  <rect x="512" y="574" width="424" height="86" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="532" y="598" font-size="12" font-weight="700" fill="#b91c1c">T2 · El prompt entero se descarta</text>
  <text x="532" y="618" font-size="11.5" fill="#7f1d1d">Con @buscar_* o @discourse, la ruta conversacional</text>
  <text x="532" y="635" font-size="11.5" fill="#7f1d1d">hace clean_cp = '' y tus 8 000 caracteres nunca</text>
  <text x="532" y="652" font-size="11.5" fill="#7f1d1d">llegan. {{doc:}} y {{hoja:}} NO hacen esto.</text>
</svg>
