<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a6p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="446" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">El ciclo de trabajo que reemplaza</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Hoy: escribir en ChatGPT → pegar → guardar → crear un seguimiento real → esperar el cron → adivinar qué pasó.</text>

  <!-- 1 -->
  <rect x="40" y="106" width="132" height="128" rx="10" fill="#ffffff" stroke="#d7dce4"/>
  <circle cx="66" cy="132" r="13" fill="#7c3aed"/>
  <text x="66" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="58" y="168" font-size="13" font-weight="800" fill="#151b28">Entrevista</text>
  <text x="58" y="189" font-size="10.5" fill="#5c6675">7 preguntas, una</text>
  <text x="58" y="204" font-size="10.5" fill="#5c6675">a la vez. Empieza</text>
  <text x="58" y="219" font-size="10.5" fill="#5c6675">por el objetivo.</text>

  <path d="M172,170 L189,170" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)" fill="none"/>

  <!-- 2 -->
  <rect x="197" y="106" width="132" height="128" rx="10" fill="#ffffff" stroke="#d7dce4"/>
  <circle cx="223" cy="132" r="13" fill="#7c3aed"/>
  <text x="223" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="215" y="168" font-size="13" font-weight="800" fill="#151b28">Borrador</text>
  <text x="215" y="189" font-size="10.5" fill="#5c6675">Por secciones:</text>
  <text x="215" y="204" font-size="10.5" fill="#5c6675">rol · contexto ·</text>
  <text x="215" y="219" font-size="10.5" fill="#5c6675">flujo · cierre.</text>

  <path d="M329,170 L346,170" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)" fill="none"/>

  <!-- 3 LINTER -->
  <rect x="354" y="106" width="132" height="128" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="380" cy="132" r="13" fill="#dc2626"/>
  <text x="380" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="372" y="168" font-size="13" font-weight="800" fill="#b91c1c">Linter</text>
  <text x="372" y="189" font-size="10.5" fill="#7f1d1d">Sin IA, al instante.</text>
  <text x="372" y="204" font-size="10.5" fill="#7f1d1d">✕ bloquea guardar</text>
  <text x="372" y="219" font-size="10.5" fill="#7f1d1d">⚠ solo avisa</text>

  <path d="M486,170 L503,170" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)" fill="none"/>

  <!-- 4 PROBADOR -->
  <rect x="511" y="106" width="132" height="128" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="537" cy="132" r="13" fill="#2563eb"/>
  <text x="537" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="529" y="168" font-size="13" font-weight="800" fill="#1d4ed8">Probador</text>
  <text x="529" y="189" font-size="10.5" fill="#1e40af">Motor real, envío</text>
  <text x="529" y="204" font-size="10.5" fill="#1e40af">apagado. Ves el</text>
  <text x="529" y="219" font-size="10.5" fill="#1e40af">prompt ensamblado.</text>

  <path d="M643,170 L660,170" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)" fill="none"/>

  <!-- 5 APLICAR -->
  <rect x="668" y="106" width="132" height="128" rx="10" fill="#ffffff" stroke="#d7dce4"/>
  <circle cx="694" cy="132" r="13" fill="#7c3aed"/>
  <text x="694" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="686" y="168" font-size="13" font-weight="800" fill="#151b28">Aplicar</text>
  <text x="686" y="189" font-size="10.5" fill="#5c6675">Campo por campo,</text>
  <text x="686" y="204" font-size="10.5" fill="#5c6675">con diff. Nunca</text>
  <text x="686" y="219" font-size="10.5" fill="#5c6675">en bloque.</text>

  <path d="M800,170 L817,170" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)" fill="none"/>

  <!-- 6 GUARDAR -->
  <rect x="825" y="106" width="135" height="128" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="851" cy="132" r="13" fill="#059669"/>
  <text x="851" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="843" y="168" font-size="13" font-weight="800" fill="#047857">Guardar</text>
  <text x="843" y="189" font-size="10.5" fill="#065f46">Lo guardas tú, no</text>
  <text x="843" y="204" font-size="10.5" fill="#065f46">el asistente. Queda</text>
  <text x="843" y="219" font-size="10.5" fill="#065f46">versión con rollback.</text>

  <!-- LOOP BACK -->
  <path d="M577,234 L577,286 L263,286 L263,240" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a6p)" fill="none"/>
  <rect x="309" y="272" width="222" height="26" rx="13" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="420" y="289" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">no convence → ajustar y repetir</text>

  <!-- GATE NOTE -->
  <rect x="354" y="316" width="290" height="26" rx="13" fill="#fef2f2" stroke="#fecaca"/>
  <text x="499" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">con un ✕ abierto, el paso 6 no está disponible</text>

  <!-- BOTTOM -->
  <rect x="40" y="360" width="920" height="62" rx="10" fill="#ffffff" stroke="#d7dce4"/>
  <text x="64" y="384" font-size="12.5" font-weight="800" fill="#151b28">Lo que cambia de fondo</text>
  <text x="64" y="406" font-size="12" fill="#5c6675">El bucle pasa de días (publicar y esperar a que un cliente real responda) a segundos, y sin gastar mensajes ni arriesgar un agente en producción.</text>
</svg>
