<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="646" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Arquitectura del Asistente</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Una sola fuente de verdad alimenta las cuatro piezas · agregar una directiva futura es agregar una entrada, nada más</text>

  <!-- REGISTRY -->
  <rect x="250" y="94" width="500" height="98" rx="12" fill="#7c3aed"/>
  <text x="500" y="124" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">REGISTRY DE CAPACIDADES</text>
  <text x="500" y="145" text-anchor="middle" font-size="11.5" fill="#ddd6fe" font-family="ui-monospace, Menlo, Consolas, monospace">app/services/ai_agent_assistant/capabilities.rb</text>
  <text x="500" y="166" text-anchor="middle" font-size="11.5" fill="#ede9fe">11 capacidades · sintaxis · requisitos · exclusiones · precedencia</text>
  <text x="500" y="183" text-anchor="middle" font-size="11.5" fill="#ede9fe">+ EngineConfig: modelo y tope de tokens por inbox</text>

  <rect x="40" y="112" width="188" height="62" rx="9" fill="#ffffff" stroke="#d7dce4"/>
  <text x="58" y="134" font-size="11" font-weight="700" fill="#7c3aed">POR QUÉ IMPORTA</text>
  <text x="58" y="152" font-size="11" fill="#5c6675">Se agregarán más directivas.</text>
  <text x="58" y="167" font-size="11" fill="#5c6675">Aquí se agregan una vez.</text>
  <path d="M228,143 L244,143" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>

  <rect x="772" y="112" width="188" height="62" rx="9" fill="#ffffff" stroke="#d7dce4"/>
  <text x="790" y="134" font-size="11" font-weight="700" fill="#059669">GUARDARRAÍL</text>
  <text x="790" y="152" font-size="11" fill="#5c6675">Un spec falla en CI si alguien</text>
  <text x="790" y="167" font-size="11" fill="#5c6675">agrega una directiva sin registrar.</text>
  <path d="M756,143 L768,143" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>

  <!-- fan-out -->
  <path d="M500,192 L500,214" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M148,214 L852,214" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M148,214 L148,244" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>
  <path d="M382,214 L382,244" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>
  <path d="M617,214 L617,244" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>
  <path d="M852,214 L852,244" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>

  <!-- PIECE 1 CHAT -->
  <rect x="40" y="250" width="216" height="148" rx="11" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="40" y="250" width="216" height="4" rx="2" fill="#7c3aed"/>
  <text x="60" y="280" font-size="14" font-weight="800" fill="#151b28">1 · CHAT</text>
  <text x="60" y="300" font-size="11.5" fill="#5c6675">Entrevista, audita y ajusta</text>
  <text x="60" y="322" font-size="11" fill="#64748b">▸ 7 preguntas, una a la vez</text>
  <text x="60" y="340" font-size="11" fill="#64748b">▸ borrador por secciones</text>
  <text x="60" y="358" font-size="11" fill="#64748b">▸ aplica campo por campo</text>
  <rect x="60" y="368" width="128" height="20" rx="10" fill="#f5f3ff"/>
  <text x="70" y="382" font-size="10.5" font-weight="700" fill="#6d28d9">SIEMPRE BORRADOR</text>

  <!-- PIECE 2 LINTER -->
  <rect x="274" y="250" width="216" height="148" rx="11" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="274" y="250" width="216" height="4" rx="2" fill="#dc2626"/>
  <text x="294" y="280" font-size="14" font-weight="800" fill="#151b28">2 · LINTER</text>
  <text x="294" y="300" font-size="11.5" fill="#5c6675">20 reglas, sin IA, instantáneo</text>
  <text x="294" y="322" font-size="11" fill="#64748b">✕ conflicto de directivas</text>
  <text x="294" y="340" font-size="11" fill="#64748b">✕ feature no habilitada</text>
  <text x="294" y="358" font-size="11" fill="#64748b">⚠ prompt fuera de presupuesto</text>
  <rect x="294" y="368" width="112" height="20" rx="10" fill="#fef2f2"/>
  <text x="304" y="382" font-size="10.5" font-weight="700" fill="#b91c1c">BLOQUEA GUARDAR</text>

  <!-- PIECE 3 PROBADOR -->
  <rect x="508" y="250" width="216" height="148" rx="11" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="508" y="250" width="216" height="4" rx="2" fill="#2563eb"/>
  <text x="528" y="280" font-size="14" font-weight="800" fill="#151b28">3 · PROBADOR</text>
  <text x="528" y="300" font-size="11.5" fill="#5c6675">Motores reales, envío apagado</text>
  <text x="528" y="322" font-size="11" fill="#64748b">▸ mensaje de cada intento</text>
  <text x="528" y="340" font-size="11" fill="#64748b">▸ ruta del router y acciones</text>
  <text x="528" y="358" font-size="11" fill="#64748b">▸ «Ver prompt» ya ensamblado</text>
  <rect x="528" y="368" width="118" height="20" rx="10" fill="#eff6ff"/>
  <text x="538" y="382" font-size="10.5" font-weight="700" fill="#1d4ed8">SIN EFECTOS REALES</text>

  <!-- PIECE 4 BIBLIOTECA -->
  <rect x="742" y="250" width="218" height="148" rx="11" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="742" y="250" width="218" height="4" rx="2" fill="#059669"/>
  <text x="762" y="280" font-size="14" font-weight="800" fill="#151b28">4 · BIBLIOTECA</text>
  <text x="762" y="300" font-size="11.5" fill="#5c6675">Patrones de agentes reales</text>
  <text x="762" y="322" font-size="11" fill="#64748b">▸ arquitectura de estados</text>
  <text x="762" y="340" font-size="11" fill="#64748b">▸ llenado de slots</text>
  <text x="762" y="358" font-size="11" fill="#64748b">▸ nodo de cierre único</text>
  <rect x="762" y="368" width="112" height="20" rx="10" fill="#ecfdf5"/>
  <text x="772" y="382" font-size="10.5" font-weight="700" fill="#047857">BLOQUES, NO CLONES</text>

  <!-- fan-in -->
  <path d="M148,398 L148,424" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M382,398 L382,424" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M617,398 L617,424" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M852,398 L852,424" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M148,424 L852,424" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M310,424 L310,458" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>
  <path d="M690,424 L690,458" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)" fill="none"/>

  <!-- DOORS -->
  <text x="500" y="450" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">MISMO COMPONENTE, DOS CAJAS</text>

  <rect x="120" y="464" width="380" height="140" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="140" y="482" width="76" height="20" rx="10" fill="#7c3aed"/>
  <text x="178" y="496" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">PRINCIPAL</text>
  <text x="140" y="526" font-size="14" font-weight="800" fill="#151b28">Página propia</text>
  <text x="140" y="548" font-size="11.5" fill="#5c6675" font-family="ui-monospace, Menlo, Consolas, monospace">/tracking-dashboard/assistant</text>
  <text x="140" y="570" font-size="11.5" fill="#5c6675">Opción del menú Campañas, junto a Agentes IA.</text>
  <text x="140" y="588" font-size="11.5" fill="#5c6675">Aquí se crea de cero: entrevista, probador, patrones.</text>

  <rect x="520" y="464" width="380" height="140" rx="11" fill="#ffffff" stroke="#d7dce4"/>
  <rect x="540" y="482" width="76" height="20" rx="10" fill="#eef1f5"/>
  <text x="578" y="496" text-anchor="middle" font-size="10.5" font-weight="800" fill="#64748b">EMBEBIDO</text>
  <text x="540" y="526" font-size="14" font-weight="800" fill="#151b28">Cajón en el editor</text>
  <text x="540" y="548" font-size="11.5" fill="#5c6675" font-family="ui-monospace, Menlo, Consolas, monospace">EditTemplate.vue</text>
  <text x="540" y="570" font-size="11.5" fill="#5c6675">Para ajustar un agente que ya existe sin salir</text>
  <text x="540" y="588" font-size="11.5" fill="#5c6675">del formulario. Arranca en modo Auditar.</text>
</svg>
