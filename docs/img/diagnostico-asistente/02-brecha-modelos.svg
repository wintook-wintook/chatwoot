<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="470" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">La brecha: quien escribe vs quien atiende</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">El Entrenamiento se escribe con un modelo fuerte y se ejecuta, por defecto, con uno chico</text>

  <!-- Escribe -->
  <rect x="40" y="96" width="370" height="250" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="62" y="128" font-size="12" font-weight="700" fill="#16a34a" letter-spacing="1">ESCRIBE · ASISTENTE</text>
  <text x="62" y="160" font-size="22" font-weight="800" fill="#151b28">gpt-4o</text>
  <text x="62" y="180" font-size="12" fill="#5c6675">piso fijo · MODEL_FLOOR[:authoring_assistant]</text>
  <line x1="62" y1="198" x2="388" y2="198" stroke="#e3e7ee"/>
  <text x="62" y="222" font-size="12.5" fill="#3b4453">hasta 12 000 tokens de salida</text>
  <text x="62" y="244" font-size="12.5" fill="#3b4453">temperatura 0.2</text>
  <text x="62" y="266" font-size="12.5" fill="#3b4453">comprobador + 3 correcciones + ruteo</text>
  <text x="62" y="288" font-size="12.5" fill="#3b4453">Entrenamientos de 17 000 caracteres</text>
  <text x="62" y="326" font-size="11" fill="#5c6675" font-family="ui-monospace, Menlo, monospace">engine_config.rb:55 · :73</text>

  <!-- Atiende -->
  <rect x="530" y="96" width="370" height="250" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="552" y="128" font-size="12" font-weight="700" fill="#dc2626" letter-spacing="1">ATIENDE · MOTOR EN VIVO</text>
  <text x="552" y="160" font-size="22" font-weight="800" fill="#151b28">gpt-4o-mini</text>
  <text x="552" y="180" font-size="12" fill="#5c6675">DEFAULT_MODEL · sin piso para atender</text>
  <line x1="552" y1="198" x2="878" y2="198" stroke="#e3e7ee"/>
  <text x="552" y="222" font-size="12.5" fill="#3b4453">250 tokens de respuesta</text>
  <text x="552" y="244" font-size="12.5" fill="#3b4453">temperatura 0.7 · espera máx. 10 s</text>
  <text x="552" y="266" font-size="12.5" fill="#3b4453">base de conocimiento recortada a 800</text>
  <text x="552" y="288" font-size="12.5" fill="#3b4453">«máximo 4 líneas»</text>
  <text x="552" y="326" font-size="11" fill="#5c6675" font-family="ui-monospace, Menlo, monospace">engine_config.rb:30 · analyzer_job:675, 719, 2097</text>

  <path d="M410,221 L526,221" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <text x="468" y="210" font-size="11" fill="#5c6675" text-anchor="middle">Entrenamiento</text>

  <!-- consecuencia -->
  <rect x="40" y="370" width="860" height="72" rx="10" fill="#fff6e8" stroke="#f3d29b"/>
  <text x="62" y="398" font-size="13.5" font-weight="700" fill="#7c4a03">Medido en KBase: gpt-4o-mini no cumple las reglas de un prompt largo; gpt-4o sí.</text>
  <text x="62" y="420" font-size="12.5" fill="#7c4a03">Un Entrenamiento bien escrito se ejecuta en un modelo que se salta sus reglas. Esto lo resuelve la decisión D1.</text>
</svg>
