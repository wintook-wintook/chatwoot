<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="430" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Por dónde empezar</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Tres pasos en orden · cada uno se cierra con un punto de control antes de pasar al siguiente</text>

  <!-- Paso 1 -->
  <rect x="40" y="100" width="250" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="72" cy="132" r="16" fill="#2563eb"/>
  <text x="72" y="137" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="130" font-size="16" font-weight="700" fill="#151b28">Medir hoy</text>
  <text x="98" y="148" font-size="11.5" fill="#2563eb" font-weight="600">F0 · línea base</text>
  <text x="58" y="180" font-size="12" fill="#3b4453">3 agentes · 20–30 mensajes c/u</text>
  <text x="58" y="199" font-size="12" fill="#3b4453">aciertos · tiempo · costo</text>
  <text x="58" y="218" font-size="12" fill="#3b4453">con el modelo actual del canal</text>
  <text x="58" y="237" font-size="11" fill="#5c6675" font-style="italic">no cambia nada del sistema</text>

  <!-- Paso 2 -->
  <rect x="345" y="100" width="250" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <circle cx="377" cy="132" r="16" fill="#d97706"/>
  <text x="377" y="137" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="403" y="130" font-size="16" font-weight="700" fill="#151b28">Decidir D1</text>
  <text x="403" y="148" font-size="11.5" fill="#d97706" font-weight="600">modelo del agente en vivo</text>
  <text x="363" y="180" font-size="12" fill="#3b4453">A · piso para todos</text>
  <text x="363" y="199" font-size="12" fill="#3b4453">B · solo aviso</text>
  <text x="363" y="218" font-size="12" font-weight="700" fill="#151b28">C · por tamaño ← recomendada</text>
  <text x="363" y="237" font-size="11" fill="#5c6675" font-style="italic">el umbral sale de los números de F0</text>

  <!-- Paso 3 -->
  <rect x="650" y="100" width="250" height="150" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="682" cy="132" r="16" fill="#dc2626"/>
  <text x="682" y="137" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="708" y="130" font-size="16" font-weight="700" fill="#151b28">Preparar gpt-5.x</text>
  <text x="708" y="148" font-size="11.5" fill="#dc2626" font-weight="600">P3 · antes de P1</text>
  <text x="668" y="180" font-size="12" fill="#3b4453">un solo constructor de parámetros</text>
  <text x="668" y="199" font-size="12" fill="#3b4453">ninguna llamada armada a mano</text>
  <text x="668" y="218" font-size="12" fill="#3b4453">sin esto: falla silenciosa</text>
  <text x="668" y="237" font-size="11" fill="#5c6675" font-style="italic">el cliente se queda sin respuesta</text>

  <path d="M290,175 L341,175" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#a1)"/>
  <path d="M595,175 L646,175" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#a1)"/>

  <!-- puntos de control -->
  <text x="40" y="292" font-size="12" font-weight="700" fill="#5c6675" letter-spacing="1">PUNTO DE CONTROL PARA PASAR AL SIGUIENTE</text>
  <rect x="40" y="304" width="250" height="68" rx="8" fill="#eef3ff" stroke="#bfd0f7"/>
  <text x="56" y="328" font-size="12" fill="#1e3a8a">✓ números anotados en la</text>
  <text x="56" y="346" font-size="12" fill="#1e3a8a">  sección «Registro» del plan</text>
  <rect x="345" y="304" width="250" height="68" rx="8" fill="#fff6e8" stroke="#f3d29b"/>
  <text x="361" y="328" font-size="12" fill="#7c4a03">✓ opción elegida y umbral fijado</text>
  <text x="361" y="346" font-size="12" fill="#7c4a03">  (caracteres o número de rutas)</text>
  <rect x="650" y="304" width="250" height="68" rx="8" fill="#fdeeee" stroke="#f2b8b8"/>
  <text x="666" y="328" font-size="12" fill="#7f1d1d">✓ la pila da lo mismo que en F0</text>
  <text x="666" y="346" font-size="12" fill="#7f1d1d">  con gpt-4o (nada se rompió)</text>

  <text x="40" y="404" font-size="12.5" fill="#3b4453">Después sigue <tspan font-weight="700">P1</tspan> (aplicar D1 y, si conviene, gpt-5.x), luego <tspan font-weight="700">P2</tspan> simulador + juez y <tspan font-weight="700">P4</tspan> revisión en lote.</text>
</svg>
