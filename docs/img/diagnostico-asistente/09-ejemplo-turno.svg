<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="600" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Un turno del P8, paso a paso</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Ejemplo ilustrativo · pedido: «agrega una ruta para cotizar grúas con la hoja de tarifas»</text>

  <!-- columnas -->
  <g font-size="11" font-weight="700" fill="#5c6675" letter-spacing="1">
    <text x="40" y="100">LO QUE HACE EL ASISTENTE</text>
    <text x="560" y="100">LO QUE VES EN PANTALLA</text>
  </g>

  <g font-size="12.5">
    <!-- 1 -->
    <circle cx="56" cy="128" r="12" fill="#2563eb"/><text x="56" y="133" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="78" y="126" font-weight="700" fill="#151b28">ver_recursos</text>
    <text x="78" y="144" fill="#5c6675">encuentra la hoja «Tarifas Grúas»</text>
    <text x="560" y="134" fill="#3b4453" font-style="italic">Buscando tus hojas…</text>

    <!-- 2 -->
    <circle cx="56" cy="184" r="12" fill="#2563eb"/><text x="56" y="189" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="78" y="182" font-weight="700" fill="#151b28">ver_hoja «Tarifas Grúas»</text>
    <text x="78" y="200" fill="#5c6675">columnas reales: Destino · Tonelaje · Precio</text>
    <text x="560" y="190" fill="#3b4453" font-style="italic">Leyendo la hoja Tarifas Grúas…</text>

    <!-- 3 -->
    <circle cx="56" cy="240" r="12" fill="#2563eb"/><text x="56" y="245" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="78" y="238" font-weight="700" fill="#151b28">ver_directiva hoja_buscar</text>
    <text x="78" y="256" fill="#5c6675">sintaxis exacta, con columnas que existen</text>
    <text x="560" y="246" fill="#3b4453" font-style="italic">Revisando cómo se consulta una hoja…</text>

    <!-- 4 -->
    <circle cx="56" cy="296" r="12" fill="#7c3aed"/><text x="56" y="301" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="78" y="294" font-weight="700" fill="#151b28">escribe la ruta nueva</text>
    <text x="78" y="312" fill="#5c6675">las rutas que no pediste las protege el código</text>
    <text x="560" y="302" fill="#3b4453" font-style="italic">Escribiendo la ruta cotizar_grua…</text>

    <!-- 5 -->
    <circle cx="56" cy="352" r="12" fill="#16a34a"/><text x="56" y="357" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
    <text x="78" y="350" font-weight="700" fill="#151b28">comprobar</text>
    <text x="78" y="368" fill="#5c6675">se ejecuta, sin hallazgos bloqueantes</text>
    <text x="560" y="358" fill="#3b4453" font-style="italic">Comprobando que se ejecute…</text>

    <!-- 6 -->
    <circle cx="56" cy="408" r="12" fill="#16a34a"/><text x="56" y="413" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
    <text x="78" y="406" font-weight="700" fill="#151b28">probar_ruta × 5 frases</text>
    <text x="78" y="424" fill="#5c6675">4 caen en cotizar_grua · 1 cae en comercial</text>
    <text x="560" y="414" fill="#3b4453" font-style="italic">Probando la ruta con 5 frases…</text>

    <!-- 7 -->
    <circle cx="56" cy="464" r="12" fill="#d97706"/><text x="56" y="469" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">7</text>
    <text x="78" y="462" font-weight="700" fill="#151b28">decide: no lo arregla a ciegas</text>
    <text x="78" y="480" fill="#5c6675">«comercial» no se pidió tocar; pregunta</text>
  </g>

  <line x1="530" y1="110" x2="530" y2="490" stroke="#cbd3df" stroke-dasharray="4 3"/>

  <!-- respuesta final -->
  <rect x="40" y="504" width="860" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="528" font-size="11" font-weight="700" fill="#15803d" letter-spacing="1">RESPUESTA DEL ASISTENTE</text>
  <text x="60" y="550" font-size="12.5" fill="#151b28">«Agregué la ruta cotizar_grua con la hoja Tarifas Grúas (Destino, Tonelaje, Precio). La probé con 5 frases:</text>
  <text x="60" y="570" font-size="12.5" fill="#151b28">4 caen bien; "cuánto me cobras por mover un carro" cae en comercial. ¿Ajusto comercial para que la suelte?»</text>
</svg>
