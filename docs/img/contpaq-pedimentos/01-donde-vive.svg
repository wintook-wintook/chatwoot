<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="560" fill="#f4f6f9"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#151b28" letter-spacing="-0.4">Dónde vive el pedimento</text>
  <text x="40" y="68" font-size="13" fill="#5c6675">Tres tablas, siempre el mismo bloque de 4 campos · barrido de sys.columns en adPanchitos_Corp</text>

  <!-- bloque de campos -->
  <rect x="300" y="94" width="340" height="104" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="120" font-size="13.5" font-weight="700" fill="#5b21b6">EL BLOQUE ADUANAL</text>
  <text x="320" y="142" font-size="11.5" fill="#151b28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CPEDIMENTO       varchar(30)</text>
  <text x="320" y="158" font-size="11.5" fill="#151b28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CADUANA          varchar(60)</text>
  <text x="320" y="174" font-size="11.5" fill="#151b28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CNUMADUANA       int</text>
  <text x="320" y="190" font-size="11.5" fill="#151b28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CFECHAPEDIMENTO  datetime</text>

  <text x="470" y="222" font-size="11" fill="#5c6675" font-style="italic" text-anchor="middle">se repite, sin tabla propia, en</text>
  <path d="M470,198 L470,236" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M170,236 L780,236" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M170,236 L170,272" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path d="M470,236 L470,272" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path d="M780,236 L780,272" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>

  <!-- Card A: capas -->
  <rect x="45" y="278" width="250" height="186" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="45" y="278" width="250" height="30" rx="10" fill="#0284c7"/>
  <rect x="45" y="296" width="250" height="12" fill="#0284c7"/>
  <text x="61" y="299" font-size="13.5" font-weight="700" fill="#ffffff">admCapasProducto</text>
  <text x="61" y="332" font-size="11.5" font-weight="700" fill="#075985">CAPA de costeo</text>
  <text x="61" y="354" font-size="11.5" fill="#5c6675">grano: capa individual</text>
  <text x="61" y="371" font-size="11.5" fill="#5c6675">PEPS / UEPS / específico</text>
  <text x="61" y="388" font-size="11.5" fill="#5c6675">+ CEXISTENCIA, CCOSTO</text>
  <text x="61" y="412" font-size="11.5" font-weight="600" fill="#151b28">→ ¿qué existencia entró</text>
  <text x="61" y="428" font-size="11.5" font-weight="600" fill="#151b28">   con qué pedimento?</text>
  <text x="61" y="452" font-size="11.5" font-weight="700" fill="#dc2626">0 filas en esta empresa</text>

  <!-- Card B: series -->
  <rect x="345" y="278" width="250" height="186" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="345" y="278" width="250" height="30" rx="10" fill="#0284c7"/>
  <rect x="345" y="296" width="250" height="12" fill="#0284c7"/>
  <text x="361" y="299" font-size="13.5" font-weight="700" fill="#ffffff">admNumerosSerie</text>
  <text x="361" y="332" font-size="11.5" font-weight="700" fill="#075985">SERIE o LOTE individual</text>
  <text x="361" y="354" font-size="11.5" fill="#5c6675">grano: unidad rastreable</text>
  <text x="361" y="371" font-size="11.5" fill="#5c6675">CNUMEROSERIE, CNUMEROLOTE</text>
  <text x="361" y="388" font-size="11.5" fill="#5c6675">+ CESTADO, CCOSTO</text>
  <text x="361" y="412" font-size="11.5" font-weight="600" fill="#151b28">→ ¿de qué pedimento</text>
  <text x="361" y="428" font-size="11.5" font-weight="600" fill="#151b28">   viene ESTA pieza?</text>
  <text x="361" y="452" font-size="11.5" font-weight="700" fill="#b45309">6 filas · 0 con pedimento</text>

  <!-- Card C: inv fisico -->
  <rect x="645" y="278" width="250" height="186" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="645" y="278" width="250" height="30" rx="10" fill="#64748b"/>
  <rect x="645" y="296" width="250" height="12" fill="#64748b"/>
  <text x="661" y="299" font-size="12.5" font-weight="700" fill="#ffffff">admMovtosInvFisicoSerieCa</text>
  <text x="661" y="332" font-size="11.5" font-weight="700" fill="#334155">CONTEO físico</text>
  <text x="661" y="354" font-size="11.5" fill="#5c6675">grano: renglón de inventario</text>
  <text x="661" y="371" font-size="11.5" fill="#5c6675">físico · CIDMOVTOINVENTARIO-</text>
  <text x="661" y="388" font-size="11.5" fill="#5c6675">FISICO, CTIPO, CCANTIDAD</text>
  <text x="661" y="412" font-size="11.5" font-weight="600" fill="#151b28">→ ¿qué se contó de</text>
  <text x="661" y="428" font-size="11.5" font-weight="600" fill="#151b28">   cada pedimento?</text>
  <text x="661" y="452" font-size="11.5" font-weight="700" fill="#dc2626">0 filas en esta empresa</text>

  <!-- nota inferior -->
  <rect x="45" y="488" width="850" height="46" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="65" y="509" font-size="12" font-weight="700" fill="#b45309">admMovimientos, admDocumentos y admProductos NO tienen campo de pedimento.</text>
  <text x="65" y="527" font-size="12" fill="#7c4a12">El pedimento es atributo de la unidad física, no del documento: no se le pone pedimento a una factura.</text>
</svg>
